<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monster Truck Race</title>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <div id="menu" role="dialog" aria-labelledby="gameTitle" aria-describedby="gameIntro">
    <div class="start-card">
      <div class="start-badge">3 werelden • 5 levens • Retro-avontuur</div>

      <h1 id="gameTitle">🚚 Monster Truck Race</h1>
      <p id="gameIntro" class="start-intro">
        Race over heuvels, ontwijk vijanden en verzamel extra levens.
      </p>

      <section class="controls" aria-labelledby="controlsTitle">
        <h2 id="controlsTitle">Besturing</h2>

        <div class="control-list">
          <div class="control-row">
            <span class="key">SPATIE</span>
            <span class="control-action">Springen</span>
          </div>

          <div class="control-row">
            <span class="key">F</span>
            <span class="control-action">Raket afvuren</span>
          </div>

          <div class="control-row">
            <span class="key">←</span>
            <span class="control-action">Langzamer rijden</span>
          </div>

          <div class="control-row">
            <span class="key">→</span>
            <span class="control-action">Sneller rijden</span>
          </div>
        </div>
      </section>

      <div class="mission-list" aria-label="Doelen van het spel">
        <span>❤️ Vang hartjes</span>
        <span>🚀 Versla vijanden</span>
        <span>🏁 Bereik de finish</span>
      </div>

      <button id="startButton" type="button">START SPEL</button>
      <p class="sound-hint">🔊 Geluid en muziek starten na het klikken</p>
    </div>
  </div>

  <canvas id="gameCanvas" aria-label="Monster Truck Race speelveld"></canvas>

  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/terrain.js"></script>
  <script src="js/world/level1.js"></script>
  <script src="js/world/level2.js"></script>
  <script src="js/world/level3.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/music.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
